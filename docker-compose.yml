services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: eventpulse-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - eventpulse-net

  webserver:
    image: nginx:alpine
    container_name: eventpulse-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - eventpulse-net

  postgres:
    image: postgres:16-alpine
    container_name: eventpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventpulse
      POSTGRES_USER: eventpulse_user
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - eventpulse-net

  redis:
    image: redis:7-alpine
    container_name: eventpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - eventpulse-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: eventpulse-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - eventpulse-net

networks:
  eventpulse-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local